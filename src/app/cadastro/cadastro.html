<div class="cadastro-container">
  <h2>Cadastro de pessoa</h2>

  <fieldset>
    <legend>Dados</legend>
    
    <label for="nome">Nome completo</label>
    <input id="nome" [(ngModel)]="pessoa.nome" placeholder="Digite o nome" />

    <label for="email">E-mail</label>
    <input id="email" [(ngModel)]="pessoa.email" [class.ruim]="erros.email" placeholder="Digite o e-mail" />
    @if (erros.email) {
      <small class="erro">{{ erros.email }}</small>
    }

    <label for="curso">Curso</label>
    <select id="curso" [(ngModel)]="pessoa.curso">
      <option value="Engenharia de Computação">Engenharia de Computação</option>
      <option value="Análise e Desenv. de Sistemas">Análise e Desenv. de Sistemas</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Vínculo</legend>
    
    <label for="tipo">Tipo</label>
    <select id="tipo" [(ngModel)]="pessoa.tipo">
      <option value="aluno">Aluno</option>
      <option value="professor">Professor</option>
    </select>

    <label for="telefone">Telefone</label>
    <input id="telefone" [(ngModel)]="pessoa.telefone" [class.ruim]="erros.telefone" placeholder="Digite o telefone" />
    @if (erros.telefone) {
      <small class="erro">{{ erros.telefone }}</small>
    }
  </fieldset>

  <button (click)="salvar()" [disabled]="temErro">Salvar</button>

  <h3>Pessoas ({{ pessoas.length }})</h3>

  @for (p of pessoas; track $index) {
    <div class="cartao">
      <b>{{ p.nome }}</b>
      <span>{{ p.email }} · {{ p.tipo }}</span>
    </div>
  }
</div>
